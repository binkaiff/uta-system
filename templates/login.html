<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTA Manpower Service - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f7f8fc 0%, #eef1f7 100%);
            color: #1a1a2e;
        }

        /* Background decoration */
        .bg-animation {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            background: rgba(220, 20, 60, 0.055);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 10%;
            animation-delay: -10s;
        }

        .circle:nth-child(4) {
            width: 250px;
            height: 250px;
            top: 30%;
            right: -50px;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Login container */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin: 0 auto;
        }

        .login-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 42px 38px;
            border: 1px solid rgba(26, 26, 46, 0.08);
            box-shadow: 0 18px 45px rgba(26, 33, 62, 0.14);
            animation: slideUp 0.55s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #DC143C, #8B0000);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            padding: 15px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(220, 20, 60, 0.18);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-section h1 {
            font-size: 28px;
            line-height: 1.12;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: #667085;
            font-size: 14px;
        }

        .license-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f0f1f3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #667085;
            margin-top: 10px;
        }

        /* Accounts / Candidates selector */
        .system-selector {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            padding: 6px;
            margin-bottom: 10px;
            background: #f4f6f9;
            border: 1px solid #e3e7ee;
            border-radius: 15px;
        }

        .system-option {
            min-height: 46px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: #667085;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .system-option i {
            font-size: 15px;
        }

        .system-option:hover:not(.active) {
            background: #ffffff;
            border-color: #e0e5ec;
            color: #344054;
        }

        .system-option.active {
            background: linear-gradient(135deg, #DC143C, #b51030);
            border-color: #DC143C;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(220, 20, 60, 0.20);
        }

        .system-hint {
            text-align: center;
            color: #8a94a6;
            font-size: 11.5px;
            font-weight: 500;
            margin: 0 0 20px;
        }

        /* Form */
        #loginForm {
            width: 100%;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .input-icon {
            width: 100%;
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #DC143C;
            font-size: 18px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .form-group input {
            display: block;
            width: 100%;
            height: 52px;
            padding: 0 16px 0 54px;
            border: 1.5px solid #e1e6ed;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            background: #fbfcfe;
            color: #1a1a2e;
        }

        .form-group input:hover {
            border-color: #cfd5df;
        }

        .form-group input:focus {
            outline: none;
            border-color: #DC143C;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.09);
        }

        .login-btn {
            width: 100%;
            min-height: 52px;
            padding: 0 16px;
            margin-top: 4px;
            background: linear-gradient(135deg, #DC143C, #9f1029);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: 0 5px 14px rgba(220, 20, 60, 0.18);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(220, 20, 60, 0.25);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Alert */
        .alert {
            padding: 11px 13px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
        }

        .alert-error {
            background: #fff1f3;
            color: #b4233f;
            border: 1px solid #ffd3dc;
        }

        .alert-success {
            background: #edf9f0;
            color: #237a3e;
            border: 1px solid #cdebd5;
        }

        /* Security */
        .info-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf0f4;
            text-align: center;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 11.5px;
            font-weight: 500;
            color: #249447;
            background: #eaf7ed;
            padding: 7px 14px;
            border-radius: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 11.5px;
            color: rgba(0, 0, 0, 0.55);
        }

        @media (max-width: 600px) {
            .login-container {
                max-width: 100%;
                padding: 14px;
            }

            .login-card {
                padding: 32px 22px;
                border-radius: 22px;
            }

            .logo-icon {
                width: 82px;
                height: 82px;
            }

            .logo-section h1 {
                font-size: 24px;
            }

            .system-selector {
                gap: 5px;
                padding: 5px;
            }

            .system-option {
                min-height: 44px;
                font-size: 12.5px;
            }

            .form-group input,
            .login-btn {
                min-height: 50px;
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-animation" aria-hidden="true">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <img
                        src="{{ url_for('static', filename='logo.png') }}"
                        alt="UTA Logo"
                        onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-briefcase\' style=\'font-size: 40px; color: white;\'></i>'"
                    >
                </div>

                <h1>UTA Manpower Service</h1>
                <p>SLBFE Licensed Recruitment Agency</p>

                <div class="license-badge">
                    <i class="fas fa-certificate"></i>
                    <span>Licensed &amp; Regulated</span>
                </div>
            </div>

            <div class="system-selector" role="group" aria-label="Select system">
                <button
                    type="button"
                    class="system-option active"
                    data-system="accounts"
                    onclick="selectSystem('accounts', this)"
                >
                    <i class="fas fa-wallet"></i>
                    <span>Accounts</span>
                </button>

                <button
                    type="button"
                    class="system-option"
                    data-system="candidate"
                    onclick="selectSystem('candidate', this)"
                >
                    <i class="fas fa-users"></i>
                    <span>Candidates</span>
                </button>
            </div>

            <div id="systemHint" class="system-hint">Accounts Management System</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div id="alertMessage" class="alert" style="display: none;"></div>

                <div class="form-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login to Dashboard</span>
                </button>

                <div class="info-section">
                    <div class="security-badge">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure Access</span>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
            </form>
        </div>

        <div class="footer">
            <p>&copy; 2026 UTA Manpower Service | All Rights Reserved</p>
        </div>
    </div>

    <script>
        let selectedSystem = 'accounts';

        function selectSystem(system, button) {
            selectedSystem = system;

            document.querySelectorAll('.system-option').forEach(option => {
                option.classList.remove('active');
            });

            if (button) {
                button.classList.add('active');
            }

            const hint = document.getElementById('systemHint');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const alertDiv = document.getElementById('alertMessage');

            if (system === 'candidate') {
                hint.textContent = 'Candidate Management System';
                username.placeholder = 'Candidate Username';
            } else {
                hint.textContent = 'Accounts Management System';
                username.placeholder = 'Username';
            }

            password.value = '';
            alertDiv.style.display = 'none';
            username.focus();
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const loginBtn = document.querySelector('.login-btn');

            document.getElementById('alertMessage').style.display = 'none';

            if (!username) {
                showAlert('Please enter username', 'error');
                return;
            }

            if (!password) {
                showAlert('Please enter password', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Verifying...</span>';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        system: selectedSystem
                    })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (jsonError) {
                    throw new Error('Unexpected server response.');
                }

                if (response.ok && data.success) {
                    showAlert('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = data.redirect ||
                            (selectedSystem === 'candidate' ? '/candidate/dashboard' : '/dashboard');
                    }, 500);

                    return;
                }

                showAlert(data.message || 'Invalid username or password. Please try again.', 'error');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            } catch (error) {
                console.error(error);
                showAlert(error.message || 'Connection error. Please try again.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login to Dashboard</span>';
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');

            alertDiv.innerHTML =
                `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>` +
                `<span>${message}</span>`;

            alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
            alertDiv.style.display = 'flex';
        }
    </script>
</body>
</html>
