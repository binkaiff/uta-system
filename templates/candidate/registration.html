<!DOCTYPE html>
<html lang="en">
<head>
<title>Candidate Registration - UTA Candidate Management</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='candidate_management.css') }}">

</head>
<body>
<div class="dashboard-container">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"><img src="{{ url_for('static', filename='logo.png') }}" alt="UTA Logo"></div>
            <h2>UTA</h2>
            <p>Manpower Service</p>
            <span class="license-badge">SLBFE Licensed</span>
        </div>
        <nav class="nav-menu">
            <a href="{{ url_for('candidate_dashboard') }}" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
<a href="{{ url_for('candidate_registration') }}" class="nav-item active"><i class="fas fa-user-plus"></i><span>Registration</span></a>
<a href="{{ url_for('candidate_records') }}" class="nav-item"><i class="fas fa-users"></i><span>Candidates</span></a>
<a href="{{ url_for('candidate_invoice') }}" class="nav-item"><i class="fas fa-file-invoice"></i><span>Invoice</span></a>
            <a href="{{ url_for('logout') }}" class="nav-item"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </nav>
    </aside>
    
<main class="main-content">
    <header class="header">
        <div class="header-title">
            <h1>Candidate Registration</h1>
            <p>Add a new candidate to the UTA Candidate Management System.</p>
        </div>
        <div class="header-actions">
            <div class="date-display"><i class="fas fa-calendar-alt"></i><span>{{ current_date }}</span></div>
            <div class="candidate-system-badge"><i class="fas fa-users"></i> Candidate System</div>
        </div>
    </header>

    <section class="candidate-form-card">
        <div class="candidate-form-heading">
            <div>
                <span class="section-kicker">NEW CANDIDATE</span>
                <h2><i class="fas fa-user-plus"></i> Candidate Information</h2>
            </div>
            <div class="candidate-id-chip">
                <span>Candidate ID</span>
                <strong id="candidateIdPreview">Loading...</strong>
            </div>
        </div>

        <form id="candidateForm" autocomplete="off">
            <div class="candidate-form-grid">
                <div class="candidate-field">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input id="fullName" type="text" placeholder="Enter full name" required>
                </div>
                <div class="candidate-field">
                    <label for="passportNo">Passport No <span class="required">*</span></label>
                    <input id="passportNo" type="text" placeholder="Enter passport number" required>
                </div>
                <div class="candidate-field">
                    <label for="nic">NIC</label>
                    <input id="nic" type="text" placeholder="Enter NIC">
                </div>
                <div class="candidate-field">
                    <label for="phoneNumber">Phone Number</label>
                    <input id="phoneNumber" type="tel" placeholder="Enter phone number">
                </div>
                <div class="candidate-field">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input id="dateOfBirth" type="date">
                </div>
                <div class="candidate-field candidate-field-wide">
                    <label for="address">Address</label>
                    <input id="address" type="text" placeholder="Enter address">
                </div>
                <div class="candidate-field">
                    <label for="jobCategory">Job Category</label>
                    <input id="jobCategory" type="text" placeholder="e.g. Electrician">
                </div>
                <div class="candidate-field">
                    <label for="country">Country</label>
                    <input id="country" type="text" placeholder="e.g. UAE">
                </div>
                <div class="candidate-field">
                    <label for="agent">Agent</label>
                    <input id="agent" type="text" placeholder="Enter agent name">
                </div>
                <div class="candidate-field">
                    <label for="medicalStatus">Medical Status</label>
                    <select id="medicalStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Not Required">Not Required</option>
                    </select>
                </div>
                <div class="candidate-field">
                    <label for="visaStatus">Visa Status</label>
                    <select id="visaStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Not Required">Not Required</option>
                    </select>
                </div>
                <div class="candidate-field">
                    <label for="interviewStatus">Interview Status</label>
                    <select id="interviewStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Not Required">Not Required</option>
                    </select>
                </div>
                <div class="candidate-field candidate-field-full">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="4" placeholder="Add notes about this candidate"></textarea>
                </div>
            </div>

            <div class="candidate-form-actions">
                <button type="button" class="candidate-btn secondary" id="clearCandidateBtn">
                    <i class="fas fa-eraser"></i> Clear Form
                </button>
                <a href="{{ url_for('candidate_records') }}" class="candidate-btn outline">
                    <i class="fas fa-list"></i> View Candidates
                </a>
                <button type="submit" class="candidate-btn primary" id="saveCandidateBtn">
                    <i class="fas fa-save"></i> Save Candidate
                </button>
            </div>
        </form>
    </section>

    <div id="candidateToast" class="candidate-toast" aria-live="polite"></div>
</main>
</div>
<script src="{{ url_for('static', filename='candidate_registration.js') }}"></script>
</body>
</html>
